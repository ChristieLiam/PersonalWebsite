<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Lab 3 | Registration Page</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container mt-4">
  <h1 class="mb-4">Lab 3 | Registration</h1>
  <form id="registration-form">
    <div class="form-group">
      <label for="username">Username:</label>
      <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter Username Here..."
              required
              class="form-control"
              title="Username must start with a letter and can only contain letters and numbers. No spaces or special characters are allowed.">
      <span id="username-error" class="text-danger"></span>
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input
              type="text"
              id="email"
              name="email"
              placeholder="Enter Email Here..."
              required
              class="form-control"
              title="Enter a valid email address (e.g., name@example.com).">
      <span id="email-error" class="text-danger"></span>
    </div>

    <div class="form-group">
      <label for="pass">Password:</label>
      <input
              type="password"
              id="pass"
              name="pass"
              placeholder="Enter Password Here..."
              required
              class="form-control"
              title="Password must be at least 12 characters long and include uppercase, lowercase, number, and special character.">
      <span id="pass-error" class="text-danger"></span>
    </div>
    <div class="form-group">
      <label for="verifyPass">Re-enter Password:</label>
      <input
              type="password"
              id="verifyPass"
              name="verifyPass"
              placeholder="Re-Enter Password Here..."
              required
              class="form-control"
              title="Password must match above">
      <span id="verifyPass-error" class="text-danger"></span>
    </div>

    <button type="submit" class="btn btn-outline-primary btn-lg" id="submitButton">Register</button>
  </form>

  <div id="form-status-message" class="mt-3"></div>

  <br>
  <p> Liam Christie | Lab 3 | CSCI 3172</p>
  <a href="login.html" class="btn btn-outline-secondary">Login</a>

</div>

<script src="js/script.js"></script>
</body>
</html>
