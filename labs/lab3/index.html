<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>:Lab 3 | Registration Page</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container mt-4">
  <h1 class="mb-4">Lab 3 | Registration</h1>
  <form id="registrationForm">
    <div class="form-group">
      <label for="username">Username:</label>
      <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter Username Here..."
              required
              class="form-control"
              pattern="^[a-zA-Z][a-zA-Z0-9]*$"
              title="Username must start with a letter and can only contain letters and numbers. No spaces or special characters are allowed."
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter Email Here..."
              required
              class="form-control"
              pattern="^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,6}$"
              title="Enter a valid email address (e.g., name@example.com).">
    </div>

    <div class="form-group">
      <label for="pass">Password:</label>
      <input
              type="password"
              id="pass"
              name="pass"
              placeholder="Enter Password Here..."
              required
              class="form-control"
              pattern="^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{12,}$"
              title="Password must be at least 12 characters long and include uppercase, lowercase, number, and special character.">
    </div>
    <div class="form-group">
      <label for="verifyPass">Re-enter Password:</label>
      <input
              type="password"
              id="verifyPass"
              name="verifyPass"
              placeholder="Re-Enter Password Here..."
              required
              class="form-control"
              title="Password must match above">
    </div>

    <button type="submit" class="btn btn-outline-primary btn-lg" id="submitButton" onclick="register()">Register</button>
  </form>
</div>


<p> Liam Christie | Lab 3 | CSCI 3172</p> <a href="login.html" class="button-link">Login</a>

<script src="js/script.js"></script>
</body>
</html>
