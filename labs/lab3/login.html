<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>:Lab 3 | Login Page</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">    <title>Lab3 | Login</title>
</head>
<body>
<div class="container mt-4">
  <h1 class="mb-4">Lab 3 | Login</h1>
  <form id="login-form">
    <div class="form-group">
      <label for="username">Username:</label>
      <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter Username Here..."
              required
              class="form-control"
              title="Enter Username Here.">
      <span id="username-error" class="text-danger"></span>
    </div>
    <div class="form-group">
      <label for="pass">Password:</label>
      <input
              type="password"
              id="pass"
              name="pass"
              placeholder="Enter Password Here..."
              required
              class="form-control"
              title="Enter Password Here.">
    </div>

    <button type="submit" class="btn btn-outline-primary btn-lg" id="submitButton">Login</button>
  </form>
  <div id="form-status-message" class="mt-3"></div>


  <br>
  <p> Liam Christie | Lab 3 | CSCI 3172</p>
  <a href="index.html" class="btn btn-outline-secondary">Register</a>

</div>


<script src="js/script.js"></script>
</body>
</html>
